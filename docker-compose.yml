# APP and IMAGE_OWNER come from .env, which the deploy workflow writes from the
# repo name and owner. Nothing in this file needs editing for a new app.
# Caddy reaches the backend by its container name, <app>-backend.
services:
  backend:
    image: ghcr.io/${IMAGE_OWNER}/${APP}-backend:latest
    container_name: ${APP}-backend
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy-web
      - postgres-db

networks:
  caddy-web:
    external: true
  postgres-db:
    external: true
