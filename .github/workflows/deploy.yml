name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GHCR names must be lowercase. APP is also the server directory, the
  # container name (<app>-backend) and the sites/<app> folder Caddy serves.
  APP: ${{ github.event.repository.name }}
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize names
        run: |
          echo "APP=${APP,,}" >> "$GITHUB_ENV"
          echo "IMAGE_OWNER=${IMAGE_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.APP }}-backend:latest

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # The server never clones this repo: it only needs the compose file and
      # .env. Pulling the image relies on the GHCR login bootstrap.sh sets up.
      - name: Deploy backend on server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          umask 077
          printf 'APP=%s\nIMAGE_OWNER=%s\nDATABASE_URL=%s\nNODE_ENV=production\nPORT=3001\n' \
            "$APP" "$IMAGE_OWNER" "$DATABASE_URL" > deploy.env
          ssh "$TARGET" "mkdir -p ~/$APP"
          scp docker-compose.yml "$TARGET:~/$APP/docker-compose.yml"
          scp deploy.env "$TARGET:~/$APP/.env"
          ssh "$TARGET" "set -e; cd ~/$APP; chmod 600 .env; docker compose pull; docker compose up -d --remove-orphans"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize names
        run: echo "APP=${APP,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync frontend to server
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          ssh "$TARGET" "mkdir -p ~/infrastructure/sites/$APP"
          rsync -az --delete frontend/dist/ "$TARGET:~/infrastructure/sites/$APP/"
